# Shared LLM-track settings.
model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: float32           # T4 has no bf16; 0.5B fits in fp32
  max_length: 512
  lora: {r: 16, alpha: 32, dropout: 0.05, target_modules: [q_proj, k_proj, v_proj, o_proj]}
data: {forget_frac: 0.05}
train: {learning_rate: 1.0e-4, batch_size: 8, grad_accum: 1, epochs: 5}
eval: {max_new_tokens: 128, n_eval: 200}
