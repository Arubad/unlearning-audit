experiment_id: L1_llm_base
model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: float32
  max_length: 512
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
data:
  forget_frac: 0.05
  heldout_frac: 0.05
train:
  learning_rate: 0.0001
  batch_size: 8
  grad_accum: 1
  epochs: 5
eval:
  max_new_tokens: 128
  n_eval: 200
unlearn:
  seed: 0
  forget_frac: 0.05
  full_ft: false
logging:
  output_dir: results
audit:
  mia:
    feature_layer: -1
    n_examples: 400
    seed: 0
  attribution:
    projection_dim: 4096
    projection_seed: 0
    hessian_damping: 0.01
    n_forget: 200
    n_query: 200
    train_subset: 400
    max_full_ft_params: 2000000
  probe:
    feature_layer: -1
    n_examples: 300
  relearn:
    forget_subset_fraction: 0.05
    learning_rate: 2.0e-05
    batch_size: 4
    eval_every: 20
    max_steps: 200
    recovery_target: 0.9
  spectrum:
    top_k: 5
