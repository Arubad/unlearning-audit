# D3 unlearn + D4/D5 audit.  Each cell: unlearn from the base checkpoint, then run the full audit.
experiment_id: D3_ddpm_unlearn
base_checkpoint: results/checkpoints/ddpm_cifar10_base.pt
oracle_checkpoint: results/checkpoints/ddpm_cifar10_retain_s0.pt   # the runner substitutes s{seed} if present
model: {type: ddpm_unet_small, n_classes: 10, class_conditional: true, image_size: 32, base_channels: 64, channel_mults: [1,2,2], res_blocks: 2, attention_resolutions: [16], timesteps: 1000, beta_schedule: linear, ema_decay: 0.9999, dropout: 0.1, cfg_dropout: 0.1}
data: {root: data, dataset: cifar10, forget_class: 3, forget_frac: 0.05, num_workers: 2}
sampling: {ddim_steps: 50, guidance: 2.0, n_eval: 500, n_relearn_eval: 128}
unlearn:
  method: gradient_ascent
  forget_frac: 0.05
  retain_available: true
  steps: 2000               # matched across approximate methods
  learning_rate: 3.0e-5
  ascent_bound: 1.0
  retain_weight: 1.0
  ewc_weight: 1.0
  fisher_batches: 20
  grad_clip: 1.0
  batch_size: 64
  seed: 0
audit:
  attribution: {projection_dim: 4096, projection_seed: 1234, hessian_damping: 1.0e-2, n_forget: 256, train_subset: 2000, n_retain_queries: 256, timesteps: [100, 400, 700]}
  probe: {n_per_class: 1500, timestep: 200, C: 1.0}
  relearn: {forget_subset_fraction: 0.05, learning_rate: 1.0e-4, max_steps: 1000, eval_every: 50, recovery_target: 0.9, batch_size: 32}
  spectrum: {top_k: 5, per_layer: true, record_update_norm: true}
expected: {default: "approximate methods: attribution drop < 50% vs oracle > 90%; probe recovers the forget class; relearn fast; do_nothing control passes"}
sweep:
  method: [gradient_ascent, gradient_difference, label_annealing, variational_ewc, oracle, do_nothing]
  forget_frac: [0.01, 0.05, 0.10]
  seed: [0, 1, 2]
sweep_minimum:
  method: [gradient_ascent, label_annealing, oracle, do_nothing]
  forget_frac: [0.05]
  seed: [0, 1]
logging: {output_dir: results}
