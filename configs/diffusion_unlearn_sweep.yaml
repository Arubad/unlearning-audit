# D3 unlearn + D4/D5 audit.  Each cell: unlearn from the base checkpoint, then run the full audit.
experiment_id: D3_ddpm_unlearn
base_checkpoint: results/checkpoints/ddpm_cifar10_base.pt
# oracle retrains are found on disk per (forget_frac, seed): results/checkpoints/ddpm_cifar10_retain_f{frac}_s{seed}.pt
model: {type: ddpm_unet_small, n_classes: 10, class_conditional: true, image_size: 32, base_channels: 64, channel_mults: [1,2,2], res_blocks: 2, attention_resolutions: [16], timesteps: 1000, beta_schedule: linear, ema_decay: 0.9999, dropout: 0.1, cfg_dropout: 0.1}
data: {root: data, dataset: cifar10, forget_class: 3, forget_frac: 0.10, split_seed: 0, num_workers: 2}
sampling: {ddim_steps: 50, guidance: 2.0, n_eval: 500, n_relearn_eval: 128}
unlearn:
  method: gradient_ascent
  forget_frac: 0.10
  retain_available: true
  steps: 2000               # matched across approximate methods
  learning_rate: 3.0e-5
  ascent_bound: 1.0
  retain_weight: 1.0
  ewc_weight: 1.0
  fisher_batches: 20
  grad_clip: 1.0
  batch_size: 64
  seed: 0
audit:
  mia: {n_examples: 1000, seed: 0, timesteps: [50, 200, 400, 600, 800], secmi_t: 200, feature_timestep: 100, n_centroid: 2000}
  fingerprint: {n_per_set: 256, timesteps: [50, 200, 400, 600, 800]}
  # enabled: false from 2026-11-19 (amendment A3): run v4's validity check showed corr(TRAK prediction, oracle change) ~ 0
  # at 40 of 52 min per cell; the 14 class-regime records keep their TRAK readout
  attribution: {enabled: false, projection_dim: 4096, projection_seed: 1234, hessian_damping: 1.0e-2, n_forget: 256, train_subset: 2000, n_retain_queries: 256, timesteps: [100, 400, 700], grad_chunk: 4}
  probe: {n_per_class: 1500, timestep: 200, C: 1.0}
  relearn: {forget_subset_fraction: 0.05, learning_rate: 1.0e-4, max_steps: 1000, eval_every: 50, recovery_target: 0.9, batch_size: 32}
  spectrum: {top_k: 5, per_layer: true, record_update_norm: true}
expected: {default: "class regime: approximate methods reach high E_forget but low E_near; probe(unlearned) stays above probe(oracle); relearning faster than the oracle; Delta more aligned with g_f than retain_finetune/oracle; do_nothing control passes"}
# forget_frac 0.10 = all 5000 cats = CLASS regime (oracle never sees a cat); 0.05 = 2500 random cats = SUBSET regime
# (the other 2500 cats stay in retain; the oracle still generates cats).  Amendment 2026-11-18.
sweep:
  method: [oracle, do_nothing, gradient_ascent, gradient_difference, label_annealing, variational_ewc, retain_finetune]
  forget_frac: [0.10, 0.05]
  seed: [0, 1]
sweep_minimum:
  method: [oracle, do_nothing, gradient_ascent, gradient_difference, label_annealing, variational_ewc, retain_finetune]
  forget_frac: [0.10]
  seed: [0, 1]
logging: {output_dir: results}
