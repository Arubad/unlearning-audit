# Shared diffusion-track settings (copied into each diffusion config; YAML has no includes).
model:
  type: ddpm_unet_small
  n_classes: 10
  class_conditional: true
  image_size: 32
  base_channels: 64        # trim to 48 if the pilot exceeds 10M params
  channel_mults: [1, 2, 2]
  res_blocks: 2
  attention_resolutions: [16]
  timesteps: 1000
  beta_schedule: linear
  ema_decay: 0.9999
  dropout: 0.1
  cfg_dropout: 0.1         # classifier-free guidance label dropout
data:
  root: data
  dataset: cifar10
  forget_class: 3          # "cat"
  forget_frac: 0.05
  num_workers: 2
train:
  steps: 40000             # ~3-5 T4-h; 200 in smoke
  batch_size: 128
  learning_rate: 2.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  amp: true
  ckpt_every: 5000
sampling:
  ddim_steps: 50
  guidance: 2.0
  n_eval: 500
  n_relearn_eval: 128
